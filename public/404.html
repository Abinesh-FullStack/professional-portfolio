<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Abinesh V</title>
    <meta name="theme-color" content="#10110F" />
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10110F;color:#F5F3EC;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
      h1{font-size:clamp(4rem,18vw,10rem);margin:0;line-height:1;letter-spacing:-.03em}
      p{color:#A5A69E}
      a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:999px;background:#A5AD78;color:#10110F;font-weight:600;text-decoration:none}
      a:focus-visible{outline:2px solid #F5F3EC;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist. The portfolio is a single page.</p>
      <a id="home" href="/">Back to the portfolio</a>
    </main>
    <script>
      // Works for both user sites (/) and project sites (/<repo>/) on GitHub Pages.
      var seg = location.pathname.split('/').filter(Boolean)[0]
      if (location.hostname.endsWith('github.io') && seg) {
        document.getElementById('home').href = '/' + seg + '/'
      }
    </script>
  </body>
</html>
